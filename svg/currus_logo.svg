<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- 纯黑色背景 -->
  <rect width="1920" height="1080" fill="#000000" />
  
  <!-- 1. 外部大等边三角形 (白色) -->
  <!-- 高度920，底边宽度1062，严格等边 -->
  <polygon points="960,80 429,1000 1491,1000" fill="#FFFFFF" />
  
  <!-- 2. 内部镂空切口 (黑色，与外边平行，保证腿部粗细一致) -->
  <!-- 顶部切口起点，切至底部，形成A字形的镂空 -->
  <polygon points="960,300 556,1000 1364,1000" fill="#000000" stroke="#000000" stroke-width="2.5" />
  
  <!-- 3. 底部内部小三角形 (白色，完美坐落在黑色镂空区内部) -->
  <!-- 高度433，底边500，也是严格等边三角形 -->
  <polygon points="960,567 710,1000 1210,1000" fill="#FFFFFF" />
</svg>